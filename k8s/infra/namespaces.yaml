# k8s/infra/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: oasis-core

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: oasis-previews

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: oasis-shared-config
  namespace: oasis-core
data:
  PREVIEW_DOMAIN: "previews.oasisapp.website"
  PREVIEW_NAMESPACE: "oasis-previews"
  PROXY_PORT: "80"
  APP_FRONTEND_URL: "https://oasisapp.website"