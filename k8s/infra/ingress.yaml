
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oasis-main-ingress
  namespace: oasis-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: "nginx"

  tls:
    - hosts:
        - oasisapp.website
        - www.oasisapp.website
        - api.oasisapp.website
      secretName: oasis-tls

  rules:
    # 1. Main Website Route
    - host: "oasisapp.website"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oasis-frontend
                port:
                  number: 80

    - host: "www.oasisapp.website"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oasis-frontend
                port:
                  number: 80

    # 2. Previews Route
    - host: "*.previews.oasisapp.website"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oasis-me-proxy
                port:
                  number: 80

    # 3. API Gateway Route
    - host: "api.oasisapp.website"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
