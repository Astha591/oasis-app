apiVersion: apps/v1
kind: Deployment
metadata:
  name: oasis-frontend
  namespace: oasis-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oasis-frontend
  template:
    metadata:
      labels:
        app: oasis-frontend
    spec:
      containers:
        - name: oasis-frontend
          image: aasthaa2003/oasis-frontend@sha256:44b92989a6cb763ac5383124aba3e49b4a46096440c0854687748bf1ee6a828f
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oasis-frontend
  namespace: oasis-core
spec:
  type: ClusterIP
  selector:
    app: oasis-frontend
  ports:
    - port: 80
      targetPort: 80