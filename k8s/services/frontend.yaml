apiVersion: apps/v1
kind: Deployment
metadata:
  name: oasis-frontend
  namespace: oasis-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oasis-frontend
  template:
    metadata:
      labels:
        app: oasis-frontend
    spec:
      containers:
        - name: oasis-frontend
          image: aasthaa2003/oasis-frontend@sha256:c880a804ee80aeec6aa5f86fe7fbe6e7d6a7cc9da14b00474708de38fb449ba3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: oasis-frontend
  namespace: oasis-core
spec:
  type: ClusterIP
  selector:
    app: oasis-frontend
  ports:
    - port: 80
      targetPort: 80